spring.application.name=docusense_backend
server.port=8081

# Weaviate vector database (see docker-compose.yml)
weaviate.host=localhost
weaviate.port=8080
weaviate.scheme=http

# OpenAI answer generation (key must be supplied as an environment variable)
openai.api.key=${OPENAI_API_KEY:}

openai.chat.model=gpt-4o-mini

# Local disk storage for uploaded PDFs + their catalog metadata
docusense.storage.upload-dir=./data/uploads

# Semantic cache similarity threshold (Weaviate certainty, 0-1)
docusense.cache.similarity-threshold=0.92

# Frontend dev origin allowed for CORS
docusense.cors.allowed-origin=http://localhost:5173

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.com.calfuslearning.docusense_backend=INFO
